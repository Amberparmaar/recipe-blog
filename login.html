<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FlavorVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
  <link href="./css/components.css" rel="stylesheet">
  <link href="./css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="d-block text-center mb-3 text-decoration-none" style="font-family:Georgia;font-size:1.4rem;color:var(--text)">🍴 <span style="color:var(--primary)">Flavor</span>Verse</a>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to continue sharing & discovering recipes</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
          <div class="invalid-feedback">Please enter a valid email.</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
          <div class="invalid-feedback">Password is required.</div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember" style="color:var(--muted-text);font-size:0.9rem">Remember me</label>
          </div>
          <a href="#" id="forgot-link" style="font-size:0.9rem">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="login-btn">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Sign up</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { login, resetPassword, clearAuthSession } from './js/firebase/auth.js';
    import { getUserProfile } from './js/firebase/firestore.js';
    import { showToast, isValidEmail, showLoader, hideLoader } from './js/utils.js';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      let valid = true;

      if (!isValidEmail(email.value)) {
        email.classList.add('is-invalid');
        valid = false;
      } else email.classList.remove('is-invalid');

      if (!password.value) {
        password.classList.add('is-invalid');
        valid = false;
      } else password.classList.remove('is-invalid');

      if (!valid) return;

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in...';

      try {
  const user = await login(
    email.value.trim(),
    password.value
  );

  // Get user profile from Firestore
  const profile = await getUserProfile(user.uid);

 if (profile && (profile.isActive === false || profile.isActive === 'false')) {
        // Session clean-up bina redirect
        await clearAuthSession();

        // Toast message display karein
        showToast('Account Blocked', 'Your account is blocked please contact with admin', 'error');

        btn.disabled = false;
        btn.textContent = 'Sign In';
        return;
      }
  showToast(
    'Welcome back!',
    'Login successful',
    'success'
  );

  // Admin → Admin Dashboard
  if (profile?.role === 'admin') {

    setTimeout(() => {
      window.location.href = 'admin/dashboard.html';
    }, 800);

  } else {

    // Normal user → Home
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 800);

  }

} catch (err) {
        console.error(err);
        showToast('Login failed', err.message || 'Invalid email or password', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    document.getElementById('forgot-link').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!isValidEmail(email)) {
        showToast('Enter your email', 'Please type your email above first', 'info');
        return;
      }
      try {
        await resetPassword(email);
        showToast('Email sent', 'Check your inbox for the reset link', 'success');
      } catch (err) {
        showToast('Error', err.message, 'error');
      }
    });
  </script>
</body>
</html>
