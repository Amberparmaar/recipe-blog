<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes — FlavorVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
  <link href="./css/components.css" rel="stylesheet">
  <link href="./css/responsive.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <section class="section-sm">
    <div class="container">
      <h1 class="section-title mb-4">All Recipes</h1>

      <div class="row g-4">
        <!-- Filters -->
        <div class="col-lg-3">
          <div class="filters-panel">
            <h5 class="mb-3">Filters</h5>
            <div class="form-group">
              <label class="form-label">Search</label>
              <div class="search-bar-wrap">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" class="form-control" placeholder="Title, tags...">
                <button class="clear-search" id="clear-search" aria-label="Clear">&times;</button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Category</label>
              <select id="filter-category" class="form-control">
                <option value="">All Categories</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Difficulty</label>
              <select id="filter-difficulty" class="form-control">
                <option value="">Any</option>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Sort by</label>
              <select id="filter-sort" class="form-control">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="popular">Most Popular</option>
                <option value="rating">Highest Rated</option>
              </select>
            </div>
            <button class="btn btn-outline w-100" id="apply-filters">Apply</button>
          </div>
        </div>

        <!-- Results -->
        <div class="col-lg-9">
          <div class="row g-4" id="recipes-grid"></div>
          <div class="text-center mt-4" id="pagination"></div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/recipes.js"></script>
</body>
</html>
