<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Recipes - FlavorVerse</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    rel="stylesheet"
  >

  <link href="./css/components.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
  <link href="./css/responsive.css" rel="stylesheet">
</head>

<body>

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>


  <!-- My Recipes Section -->
  <section class="section-sm">

    <div class="container py-5">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-5">

        <div>
          <h1 class="section-title">My Recipes</h1>

          <p class="section-subtitle">
            Manage your delicious recipes
          </p>
        </div>

        <a href="add-recipe.html" class="btn btn-primary">
          <i class="fa-solid fa-plus me-2"></i>
          Add Recipe
        </a>

      </div>


      <!-- Stats -->
      <div class="row g-4 mb-5">

        <!-- Recipes -->
        <div class="col-md-4">
          <div class="card h-100 p-4 text-center">

            <i class="fa-solid fa-utensils fa-2x mb-3"></i>

            <h3 id="stat-recipes">0</h3>

            <p class="text-muted mb-0">
              My Recipes
            </p>

          </div>
        </div>


        <!-- Views -->
        <div class="col-md-4">
          <div class="card h-100 p-4 text-center">

            <i class="fa-solid fa-eye fa-2x mb-3"></i>

            <h3 id="stat-views">0</h3>

            <p class="text-muted mb-0">
              Total Views
            </p>

          </div>
        </div>


        <!-- Favorites -->
        <div class="col-md-4">
          <div class="card h-100 p-4 text-center">

            <i class="fa-solid fa-heart fa-2x mb-3"></i>

            <h3 id="stat-favorites">0</h3>

            <p class="text-muted mb-0">
              Favorites
            </p>

          </div>
        </div>

      </div>


      <!-- Recipe Cards -->
      <div
        id="my-recipes-grid"
        class="row g-4"
      >
      </div>

    </div>

  </section>


  <!-- Delete Modal -->
  <div
    class="modal fade"
    id="deleteModal"
    tabindex="-1"
    aria-hidden="true"
  >

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title">
            Delete Recipe
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close">
          </button>

        </div>


        <div class="modal-body">

          <p>
            Are you sure you want to delete
            <strong id="delete-recipe-title">
              this recipe
            </strong>?
          </p>

          <p class="text-muted mb-0">
            This action cannot be undone.
          </p>

        </div>


        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>

          <button
            type="button"
            class="btn btn-danger"
            id="confirm-delete-btn"
          >
            Delete
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- Footer -->
  <div id="footer-placeholder"></div>


  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>


  <!-- Navbar + Footer -->
  <script type="module">

    import { initNavbar } from "./js/components/navbar.js";
    import { initFooter } from "./js/components/footer.js";

    initNavbar();
    initFooter();

  </script>


  <!-- My Recipes JS -->
  <script
    type="module"
    src="./js/pages/my-recipes.js">
  </script>

</body>
</html>
