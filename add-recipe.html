<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Recipe — FlavorVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
  <link href="./css/components.css" rel="stylesheet">
  <link href="./css/responsive.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <section class="section-sm">
    <div class="container" style="max-width:800px">
      <h1 class="section-title mb-2">Share a New Recipe</h1>
      <p class="section-subtitle">Fill in the details and inspire others</p>

      <form id="add-recipe-form" class="card p-4">
        <div class="form-group">
          <label class="form-label">Recipe Title *</label>
          <input type="text" id="title" class="form-control" placeholder="e.g. Creamy Mushroom Risotto" required maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label">Short Description *</label>
          <textarea id="description" class="form-control" rows="3" placeholder="A brief mouth-watering description..." required maxlength="300"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Recipe Image *</label>
          <div class="image-upload-area" id="upload-area">
            <i class="fas fa-cloud-upload-alt"></i>
            <p class="mb-1">Click or drag an image here</p>
            <small class="text-muted">JPG, PNG, WEBP • Max 5 MB</small>
            <input type="file" id="image-input" accept="image/*" hidden>
          </div>
          <div id="image-preview-wrap" class="d-none mt-3"></div>
          <div id="upload-progress" class="progress mt-2 d-none" style="height:6px">
            <div class="progress-bar bg-warning" style="width:0%"></div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 form-group">
            <label class="form-label">Category *</label>
            <select id="category" class="form-control" required></select>
          </div>
          <div class="col-md-6 form-group">
            <label class="form-label">Difficulty *</label>
            <select id="difficulty" class="form-control" required>
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-md-4 form-group">
            <label class="form-label">Prep Time (min)</label>
            <input type="number" id="prepTime" class="form-control" min="0" placeholder="15">
          </div>
          <div class="col-md-4 form-group">
            <label class="form-label">Cook Time (min)</label>
            <input type="number" id="cookTime" class="form-control" min="0" placeholder="30">
          </div>
          <div class="col-md-4 form-group">
            <label class="form-label">Servings</label>
            <input type="number" id="servings" class="form-control" min="1" placeholder="4">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Ingredients *</label>
          <div id="ingredients-list"></div>
          <button type="button" class="btn btn-ghost btn-sm mt-2" id="add-ingredient"><i class="fas fa-plus"></i> Add Ingredient</button>
        </div>

        <div class="form-group">
          <label class="form-label">Instructions *</label>
          <div id="instructions-list"></div>
          <button type="button" class="btn btn-ghost btn-sm mt-2" id="add-instruction"><i class="fas fa-plus"></i> Add Step</button>
        </div>

        <div class="form-group">
          <label class="form-label">Tags (comma separated)</label>
          <input type="text" id="tags" class="form-control" placeholder="italian, creamy, comfort-food">
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100" id="submit-btn">
          <i class="fas fa-utensils"></i> Publish Recipe
        </button>
      </form>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/add-recipe.js"></script>
</body>
</html>
