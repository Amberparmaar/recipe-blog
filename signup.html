<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — FlavorVerse</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/components.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <a
          href="index.html"
          class="d-block text-center mb-3 text-decoration-none"
          style="font-family: Georgia; font-size: 1.4rem; color: var(--text)"
          >🍴 <span style="color: var(--primary)">Flavor</span>Verse</a
        >
        <h1>Create account</h1>
        <p class="subtitle">Join the community of food lovers</p>

        <form id="signup-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input
              type="text"
              id="name"
              class="form-control"
              placeholder="Your name"
              required
              minlength="2"
            />
            <div class="invalid-feedback">
              Please enter your name (min 2 characters).
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="you@example.com"
              required
            />
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="At least 6 characters"
              required
              minlength="6"
            />
            <div class="invalid-feedback">
              Password must be at least 6 characters.
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm">Confirm Password</label>
            <input
              type="password"
              id="confirm"
              class="form-control"
              placeholder="Repeat password"
              required
            />
            <div class="invalid-feedback">Passwords do not match.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="signup-btn">
            Create Account
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
      import { signUp } from "./js/firebase/auth.js";
      import { showToast, isValidEmail } from "./js/utils.js";

      document
        .getElementById("signup-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("name");
          const email = document.getElementById("email");
          const password = document.getElementById("password");
          const confirm = document.getElementById("confirm");
          let valid = true;

          if (name.value.trim().length < 2) {
            name.classList.add("is-invalid");
            valid = false;
          } else name.classList.remove("is-invalid");

          if (!isValidEmail(email.value)) {
            email.classList.add("is-invalid");
            valid = false;
          } else email.classList.remove("is-invalid");

          if (password.value.length < 6) {
            password.classList.add("is-invalid");
            valid = false;
          } else password.classList.remove("is-invalid");

          if (password.value !== confirm.value) {
            confirm.classList.add("is-invalid");
            valid = false;
          } else confirm.classList.remove("is-invalid");

          if (!valid) return;

          const btn = document.getElementById("signup-btn");
          btn.disabled = true;
          btn.innerHTML =
            '<span class="spinner-border spinner-border-sm"></span> Creating...';

          try {
            await signUp(name.value.trim(), email.value.trim(), password.value);
            showToast("Account created!", "Welcome to FlavorVerse", "success");
            setTimeout(() => (location.href = "index.html"), 1000);
          } catch (err) {
            console.error(err);
            showToast(
              "Signup failed",
              err.message || "Something went wrong",
              "error",
            );
            btn.disabled = false;
            btn.textContent = "Create Account";
          }
        });
    </script>
  </body>
</html>
